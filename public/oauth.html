<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login complete</title>
  <style>
    body { background: #070A0F; color: #fff; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    p { opacity: 0.6; font-size: 13px; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <!--
    Deriv redirects here with ?acct1=...&token1=...&cur1=...
    The DOAB app watches this URL via openAuthSessionAsync and parses the
    tokens from the query string. This page must NOT navigate away or hop to
    the app's custom scheme (doab://...) — doing so aborts the auth session.
  -->
  <p>Authenticated — return to DOAB.</p>
</body>
</html>
